name: Build MK Esports Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          set +o pipefail
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_DIR" ] || [ ! -d "$SDK_DIR" ]; then
            echo "Android SDK directory not found (ANDROID_HOME='$ANDROID_HOME', ANDROID_SDK_ROOT='$ANDROID_SDK_ROOT')" >&2
            exit 1
          fi
          sudo mkdir -p "$SDK_DIR/licenses"
          sudo chown -R "$(id -un):$(id -gn)" "$SDK_DIR"
          SDKMANAGER=$(find "$SDK_DIR" \( -path "*/cmdline-tools/*/bin/sdkmanager" -o -path "*/tools/bin/sdkmanager" \) \( -type f -o -type l \) 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_DIR" >&2
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER (SDK_DIR=$SDK_DIR)"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses --sdk_root="$SDK_DIR" || true
          if [ ! -s "$SDK_DIR/licenses/android-sdk-license" ]; then
            echo "Failed to write android-sdk-license in $SDK_DIR/licenses" >&2
            exit 1
          fi

      - name: Install Android SDK Packages
        run: |
          set +o pipefail
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | sdkmanager --sdk_root="$SDK_DIR" \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

      - name: Restore debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: |
          gradle --version
          gradle :app:assembleDebug --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            --stacktrace --info

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MK-Esports-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
